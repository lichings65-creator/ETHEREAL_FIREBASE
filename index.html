var AU_CSS=`@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap');
.au{min-height:100vh;display:flex;padding:16px;background:#0a0a14;color:#fff;font-family:'Outfit',system-ui,sans-serif;position:relative;overflow-x:hidden}
.au:before,.au:after{content:"";position:fixed;width:520px;height:520px;border-radius:50%;filter:blur(120px);opacity:.3;pointer-events:none}
.au:before{background:#7c3aed;top:-160px;left:-160px}.au:after{background:#ec4899;bottom:-160px;right:-160px}
.au-card{position:relative;z-index:1;width:100%;max-width:420px;margin:auto;background:rgba(15,15,26,.85);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:22px 20px;backdrop-filter:blur(20px);text-align:center}
.au-tag{display:inline-block;font-size:11px;letter-spacing:.2em;padding:4px 14px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1)}
.au h1{margin:14px 0 4px;font-size:40px;font-weight:900;line-height:.95;letter-spacing:-.03em;background:linear-gradient(90deg,#a78bfa,#e879f9,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.au p{color:rgba(255,255,255,.6);font-size:13px;margin:6px 0 14px}
.au button,.au input{font-family:'Outfit',system-ui,sans-serif}
.au-btn{width:100%;height:52px;border-radius:14px;border:1px solid rgba(255,255,255,.2);font-weight:800;font-size:14px;letter-spacing:.08em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;color:#fff;background:linear-gradient(90deg,#7c3aed,#c026d3,#06b6d4)}
.au-btn.g{background:#fff;color:#111}.au-btn.s{background:rgba(255,255,255,.07)}.au-btn:disabled{opacity:.4;cursor:not-allowed}
.au-err{margin-top:12px;font-size:12px;color:#fca5a5;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:8px 10px;text-align:left}
.au-warn{margin-top:12px;font-size:11px;color:#fde68a;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:8px 10px;text-align:left}
.au-in{width:100%;height:48px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);color:#fff;font-weight:700;font-size:16px;text-align:center;outline:none}
.au-in:focus{border-color:#e879f9}
